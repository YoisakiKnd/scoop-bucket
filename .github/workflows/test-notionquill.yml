name: Test NotionQuill manifest

# 这份 manifest 装不装得上，只有在 Windows 上装了才知道。
# （NotionQuill 主仓库是在 Linux 上开发的，这边是唯一能验证 manifest 的地方。）
#
# 维护这个 manifest 的人读不到 job 日志，所以每一步失败都要自己说出来：
# 用 ::error:: 把命令的输出带出来，用 ::notice:: 报关键事实。

on:
  push:
    paths:
      - bucket/notionquill.json
      - .github/workflows/test-notionquill.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Scoop
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          # runner 上的用户是管理员，而 scoop 的安装脚本默认拒绝以管理员身份运行：
          # 不加 -RunAsAdmin 的话它只打印一句拒绝、退出码还是 0。
          Invoke-Expression "& {$(Invoke-RestMethod https://get.scoop.sh)} -RunAsAdmin"

          # 装上哪去了不问官方文档，问这一进程自己的 PATH：安装脚本把它加进去了
          # （这也是同一进程里 scoop --version 能跑起来的原因）。
          # 后一步是新进程，继承的是 runner 启动时那份旧环境，所以必须显式传下去。
          $shim = ($env:PATH -split ';' | Where-Object { $_ -like '*scoop*shims*' } | Select-Object -First 1)
          if (-not $shim) {
            # 退而求其次：把两个常见位置都找一遍
            $shim = @('C:\ProgramData\scoop\shims', "$env:USERPROFILE\scoop\shims") |
              Where-Object { Test-Path (Join-Path $_ 'scoop.cmd') } | Select-Object -First 1
          }
          if (-not $shim) { throw "装完了还是找不到 scoop 的 shims 目录" }

          Write-Host "::notice title=scoop shims::$shim"
          & (Join-Path $shim 'scoop.cmd') --version

          # 用 .NET 追加，不用 Out-File -Encoding utf8：PowerShell 5.1 那份会带 BOM，
          # 而带 BOM 的 GITHUB_PATH 会让第一行 PATH 失效
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "SCOOP_SHIM=$shim`n")
          [System.IO.File]::AppendAllText($env:GITHUB_PATH, "$shim`n")

      - name: Add this bucket
        shell: pwsh
        run: |
          $scoop = if ($env:SCOOP_SHIM) { Join-Path $env:SCOOP_SHIM 'scoop.cmd' } else { 'scoop' }
          $log = New-Object System.Collections.Generic.List[string]
          $failed = $false
          try {
            $log.Add((& $scoop bucket add yoisaki https://github.com/YoisakiKnd/scoop-bucket 2>&1 | Out-String))
          } catch {
            $failed = $true
            $log.Add(($_ | Out-String))
          }
          $text = ($log -join "`n")
          Write-Host $text
          if ($LASTEXITCODE -ne 0 -or $text -match 'ERROR ') { $failed = $true }
          if ($failed) {
            $msg = $text.Trim() -replace "`r?`n", '%0A'
            if ($msg.Length -gt 4000) { $msg = $msg.Substring($msg.Length - 4000) }
            Write-Host "::error title=scoop bucket add 失败::$msg"
            exit 1
          }
          Write-Host "::notice title=bucket 加好了::yoisaki"

      - name: Validate the manifest against Scoop's schema before installing
        shell: pwsh
        run: |
          # scoop 用同一份 schema 校验 manifest，缺字段会直接拒绝安装。
          # 提前查一遍：错的就不是「装不上」，而是「manifest 不合规」。
          $schema = Invoke-RestMethod https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json
          $manifest = Get-Content bucket/notionquill.json -Raw | ConvertFrom-Json
          $missing = @()
          foreach ($required in $schema.required) {
            if ($null -eq $manifest.$required) { $missing += $required }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error title=manifest 不合规::缺字段：$($missing -join ', ')"
            exit 1
          }
          Write-Host "::notice title=manifest 必填字段都在::$($schema.required -join ', ')"

      - name: Install notionquill
        shell: pwsh
        run: |
          $scoop = if ($env:SCOOP_SHIM) { Join-Path $env:SCOOP_SHIM 'scoop.cmd' } else { 'scoop' }
          $log = New-Object System.Collections.Generic.List[string]
          $failed = $false
          try {
            $log.Add((& $scoop install yoisaki/notionquill 2>&1 | Out-String))
          } catch {
            $failed = $true
            $log.Add(($_ | Out-String))
          }
          $text = ($log -join "`n")
          Write-Host $text
          if ($LASTEXITCODE -ne 0 -or $text -match 'ERROR ') { $failed = $true }
          if ($failed) {
            $msg = $text.Trim() -replace "`r?`n", '%0A'
            if ($msg.Length -gt 4000) { $msg = $msg.Substring($msg.Length - 4000) }
            Write-Host "::error title=scoop install 失败::$msg"
            exit 1
          }
          Write-Host "::notice title=scoop install::装上了"

      - name: The installed app must match what the manifest says
        shell: pwsh
        run: |
          $scoop = if ($env:SCOOP_SHIM) { Join-Path $env:SCOOP_SHIM 'scoop.cmd' } else { 'scoop' }
          $manifest = Get-Content bucket/notionquill.json -Raw | ConvertFrom-Json
          $log = New-Object System.Collections.Generic.List[string]
          $failed = $false
          try {
            # 别猜路径，问 scoop：它以管理员身份装到 C:\ProgramData、普通身份装到用户目录，
            # 两种情况都见过（这台 runner 上是后者）。
            $current = (& $scoop prefix notionquill).Trim()
            $log.Add("装到了 $current")

            $exe = Join-Path $current 'notionquill.exe'
            if (!(Test-Path $exe)) {
              $log.Add((Get-ChildItem $current -Recurse | Out-String))
              throw "没装上可执行文件：$exe"
            }

            # scoop prefix 给的是 current —— 一个指向具体版本目录的链接，
            # 版本号要看它指向哪儿（install.json 里那份 manifest 快照也记着）
            $link = Get-Item $current -Force
            $resolved = @($link.LinkTarget, $link.Target) | Where-Object { $_ } | Select-Object -First 1
            $leaf = if ($resolved) { Split-Path $resolved -Leaf } else { Split-Path $current -Leaf }
            $log.Add("current 指向的版本：$leaf")
            if ($leaf -ne $manifest.version) {
              throw "scoop 装的版本（$leaf）和 manifest（$($manifest.version)）不一致"
            }

            $item = Get-Item $exe
            $log.Add("notionquill.exe：$($item.Length) 字节，FileVersion=$($item.VersionInfo.FileVersion)")

            # 真的是 Windows 可执行文件（MZ 头），而不是一个 HTML 错误页被存成了 exe
            $bytes = [System.IO.File]::ReadAllBytes($exe)[0..1]
            if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "不是 PE 文件，头两个字节是 $($bytes -join ',')"
            }
          } catch {
            $failed = $true
            $log.Add(($_ | Out-String))
          }
          $text = ($log -join "`n")
          Write-Host $text
          $msg = $text.Trim() -replace "`r?`n", '%0A'
          if ($msg.Length -gt 4000) { $msg = $msg.Substring($msg.Length - 4000) }
          if ($failed) {
            Write-Host "::error title=装上的东西对不上::$msg"
            exit 1
          }
          Write-Host "::notice title=装上了并对得上::$msg"

      - name: Report what Scoop recorded
        shell: pwsh
        run: |
          $scoop = if ($env:SCOOP_SHIM) { Join-Path $env:SCOOP_SHIM 'scoop.cmd' } else { 'scoop' }
          & $scoop list notionquill
          & $scoop info notionquill